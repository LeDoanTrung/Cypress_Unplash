name: Cypress API Tests
on:
  push:
    branches: [ main, master ]
  schedule:
    # Run at 9:00 AM daily (UTC time)
    - cron: '0 9 * * *'

jobs:
  cypress-api-tests:
    runs-on: ubuntu-latest
    strategy:
      # Không fail nhanh nếu một container test bị lỗi
      fail-fast: false
      matrix:
        containers: [1, 2] # Sử dụng 2 container chạy song song
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install

      - name: Create reports directory
        run: |
          mkdir -p cypress/reports
          mkdir -p cypress/reports/.jsons
          
      # Chuẩn bị môi trường biến cho Cypress
      - name: Set environment variables
        run: |
          echo "CYPRESS_ENV=qa" >> $GITHUB_ENV
        
      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        continue-on-error: true # Tiếp tục dù có lỗi
        with:
          # Chỉ chạy test smoke đơn giản
          spec: "cypress/e2e/test/API/API_Smoke_Test.cy.js"
          record: true
          parallel: false
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          
      # Tìm và liệt kê các file kết quả để debug
      - name: List report files
        if: always()
        run: |
          echo "Listing report directories:"
          find cypress -type d | grep -v "node_modules"
          echo "Listing JSON report files:"
          find cypress -name "*.json" | grep -v "node_modules" || echo "No JSON files found"
          
      # Tạo báo cáo đơn giản dựa trên kết quả test
      - name: Create Simple Test Report
        if: always()
        run: |
          echo "Creating simple test report"
          mkdir -p cypress/reports
          echo "Test results:"
          ls -la cypress/reports || echo "No reports directory found"
          
          if [ -f "cypress/reports/simple-report.html" ]; then
            echo "Found report created by Cypress"
          else
            echo "Creating simple HTML report"
            VIDEO_COUNT=$(find cypress/videos -type f | wc -l)
            echo "<html><head><title>API Test Report</title>" > cypress/reports/report.html
            echo "<style>body{font-family:Arial,sans-serif;margin:20px}.pass{color:green}.info{color:blue}</style>" >> cypress/reports/report.html
            echo "</head><body>" >> cypress/reports/report.html
            echo "<h1>Cypress API Test Report</h1>" >> cypress/reports/report.html
            echo "<p>Run Date: $(date)</p>" >> cypress/reports/report.html
            echo "<p><span class='info'>Test videos: $VIDEO_COUNT</span></p>" >> cypress/reports/report.html
            echo "<p><span class='pass'>Tests were executed. Check Cypress Dashboard for detailed results.</span></p>" >> cypress/reports/report.html
            echo "</body></html>" >> cypress/reports/report.html
            echo "Simple HTML report created"
          fi
          
      # Upload báo cáo test
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-report
          path: cypress/reports
          retention-days: 30
          
      # Upload screenshots khi test fail
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          
      # Upload videos để debug
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos