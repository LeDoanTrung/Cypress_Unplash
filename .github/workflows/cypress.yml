name: Cypress API Tests
on:
  push:
    branches: [ main, master ]
  schedule:
    # Run at 9:00 AM daily (UTC time)
    - cron: '0 9 * * *'

jobs:
  cypress-api-tests:
    runs-on: ubuntu-latest
    strategy:
      # Không fail nhanh nếu một container test bị lỗi
      fail-fast: false
      matrix:
        containers: [1, 2] # Sử dụng 2 container chạy song song
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install

      - name: Create reports directory
        run: |
          mkdir -p cypress/reports/html
          mkdir -p cypress/reports/json
          
      # Chuẩn bị môi trường biến cho Cypress
      - name: Set environment variables
        run: |
          echo "CYPRESS_ENV=qa" >> $GITHUB_ENV
        
      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        continue-on-error: true # Tiếp tục dù có lỗi
        with:
          # Chỉ chạy test đơn giản trước để kiểm tra báo cáo
          spec: "cypress/e2e/test/API/Simple_API_Test.cy.js"
          record: true
          parallel: false
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          
      # Tìm và liệt kê các file kết quả để debug
      - name: List report files
        if: always()
        run: |
          echo "Listing report directories:"
          find cypress -type d | grep -v "node_modules"
          echo "Listing JSON report files:"
          find cypress -name "*.json" | grep -v "node_modules" || echo "No JSON files found"
          
      # Xử lý báo cáo test kể cả khi không có file
      - name: Handle Test Reports
        if: always()
        run: |
          echo "Handling test reports"
          # Tạo thư mục báo cáo nếu chưa tồn tại
          mkdir -p cypress/reports
          # Tạo file báo cáo trống nếu không có báo cáo nào
          if [ ! -f cypress/reports/report.html ]; then
            echo "<html><body><h1>API Tests Run Summary</h1><p>Tests were executed but no report was generated. Check logs for details.</p></body></html>" > cypress/reports/report.html
          fi
          
      # Upload báo cáo test
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-report
          path: cypress/reports
          retention-days: 30
          
      # Upload screenshots khi test fail
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          
      # Upload videos để debug
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos