name: Cypress Simple API Tests
# Workflow configuration with improved metadata - Only runs simple API tests
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # Run at 9:00 AM Vietnam time (2:00 AM UTC) on weekdays (Monday to Friday)
    - cron: '0 2 * * 1-5'
  # Enable manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - stage
          - prod

# Global environment variables
env:
  NODE_VERSION: '20'
  DEFAULT_ENVIRONMENT: 'qa'

jobs:
  # Main job to run API tests
  cypress-api-smoke-tests:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent hanging jobs
    env:
      CYPRESS_ENV: ${{ github.event.inputs.environment || 'qa' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for faster checkout

      # Add cache for faster builds
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      # Install with regular npm install to update lock file
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install --prefer-offline --no-audit
          npm list --depth=0
          echo "Node modules successfully installed"

      # Create report directories with improved structure
      - name: Create reports directory
        run: |
          echo "Setting up report directories..."
          mkdir -p cypress/reports/html
          mkdir -p cypress/reports/json
          mkdir -p cypress/reports/.jsons
          mkdir -p cypress/results
          mkdir -p allure-results
          echo "Report directories created"
          
      # Health check before running tests
      - name: Pre-test environment validation
        run: |
          echo "Validating test environment..."
          node -v
          npm -v
          npx cypress verify
          echo "Cypress installation verified"
        
      # Install Allure and other reporting tools
      - name: Install Allure and other dependencies
        run: |
          echo "Installing Allure and other reporting dependencies..."
          # Use exact versions to avoid compatibility issues
          npm install -D @shelex/cypress-allure-plugin@2.40.0 allure-commandline@2.24.1 mocha-junit-reporter@2.2.0
          echo "Dependencies installed successfully"

      # Pre-verify Allure installation
      - name: Verify Allure installation
        run: |
          echo "Verifying Allure installation..."
          # Install additional dependencies that might be needed
          npm install -g allure-commandline@2.24.1
          npm list -g allure-commandline || echo "Global allure-commandline not found"
          npm list @shelex/cypress-allure-plugin || echo "Local cypress-allure-plugin not found"
          
          # Create test Allure results and generate a report to verify installation
          mkdir -p test-allure-results
          echo '{"name":"Test","status":"passed","stage":"finished"}' > test-allure-results/test-result.json
          echo "Attempting to generate a test report..."
          npx allure-commandline generate test-allure-results -o test-allure-report || echo "Failed to generate test report, but continuing"
          
          echo "Allure verification completed"

      # Run tests with proper error handling and retries
      - name: Run Cypress API tests
        id: cypress_tests
        uses: cypress-io/github-action@v6
        continue-on-error: true # Continue workflow even if tests fail
        with:
          # Only run simple API tests, exclude GetPhotographer Test
          spec: "cypress/e2e/test/API/{API_Smoke_Test,Simple_API_Test}.cy.js"
          record: true # Enable Cypress Cloud recording
          config-file: cypress.config.js
          config: "retries=2,video=true,screenshotOnRunFailure=true,reporter=json,reporterOptions={\"outputFile\":\"cypress/results/results.json\"}"
          browser: chrome
          headed: false
          install: false # Skip install since we already did it
        env:
          # Cypress Cloud recording key
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Pass GitHub token securely
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_ENV: ${{ github.event.inputs.environment || 'qa' }}
          CYPRESS_CI: true
          CYPRESS_INCLUDE_TAGS: '@api'  # Ensure only tests with @api tag are run
          CYPRESS_ALLURE: true
          
      # Debug information with improved diagnostics
      - name: Collect test diagnostics
        if: always()
        run: |
          echo "::group::Test Artifacts Diagnostics"
          echo "Collecting test diagnostics information..."
          
          # Check reports and output structured info
          echo "Report directories:"
          find cypress -type d -name "reports*" | sort
          
          echo "JSON report files:"
          find cypress -name "*.json" -not -path "*/node_modules/*" | sort || echo "No JSON files found"
          
          echo "Video files:"
          find cypress -name "*.mp4" | wc -l
          
          echo "Screenshot files:"
          find cypress -name "*.png" | wc -l
          
          echo "::endgroup::"
          
      # Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          echo "::group::Allure Report Generation"
          echo "Generating professional Allure report..."

          # Create report directory
          mkdir -p allure-results
          mkdir -p allure-report
          mkdir -p cypress/reports/allure
          
          # Create essential directories that might be missing
          mkdir -p cypress/videos
          mkdir -p cypress/screenshots
          mkdir -p cypress/reports/junit
          
          # Move Cypress results to allure-results if they exist
          if [ -d "cypress/results" ]; then
            cp -r cypress/results/* allure-results/ || echo "No results found in cypress/results"
          fi
          
          # Collect test metrics for summary
          VIDEO_COUNT=$(find cypress/videos -type f 2>/dev/null | wc -l || echo "0")
          SCREENSHOT_COUNT=$(find cypress/screenshots -type f 2>/dev/null | wc -l || echo "0")
          XML_COUNT=$(find cypress/reports/junit -name "*.xml" 2>/dev/null | wc -l || echo "0")
          TEST_FILES=$(find cypress/e2e/test/API -name "*.cy.js" 2>/dev/null | wc -l || echo "0")
          
          # Generate Allure report from results using compatible syntax
          echo "Generating Allure report from test results..."
          # First remove old report if it exists
          rm -rf allure-report
          # Then generate new report
          npx allure-commandline generate allure-results -o allure-report
          
          # Create a simple redirect HTML file
          echo "Creating report navigation files..."
          echo "<html><head><meta http-equiv=\"refresh\" content=\"0; URL='allure-report/index.html'\"></head><body>Redirecting to Allure report...</body></html>" > cypress/reports/index.html

          # Create a helpful README for navigating artifacts
          echo "# Cypress API Test Results with Allure" > cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "This artifact contains the results of Cypress API tests run on $(date)." >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "## Contents" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "- \`/allure-report/\` - Allure HTML report with detailed test results" >> cypress/reports/README.md
          echo "- \`/cypress/screenshots/\` - Screenshots captured during test failures (if any)" >> cypress/reports/README.md
          echo "- \`/cypress/videos/\` - Video recordings of test runs" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "## Test Summary" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "- **Videos:** ${VIDEO_COUNT}" >> cypress/reports/README.md
          echo "- **Screenshots:** ${SCREENSHOT_COUNT}" >> cypress/reports/README.md
          echo "- **XML Reports:** ${XML_COUNT}" >> cypress/reports/README.md
          echo "- **Test Files:** ${TEST_FILES}" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "## Viewing the Report" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "- Start by opening the [Allure Report](./allure-report/index.html)" >> cypress/reports/README.md
          echo "- Videos of test runs are in the [videos folder](./cypress/videos/)" >> cypress/reports/README.md
          echo "- Screenshots taken during test failures are in the [screenshots folder](./cypress/screenshots/)" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "## Environment Information" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "- **Environment:** ${CYPRESS_ENV}" >> cypress/reports/README.md
          echo "- **Workflow:** ${GITHUB_WORKFLOW}" >> cypress/reports/README.md
          echo "- **Run Date:** $(date)" >> cypress/reports/README.md
          echo "- **Node Version:** $(node -v)" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "---" >> cypress/reports/README.md
          echo "" >> cypress/reports/README.md
          echo "*This artifact was automatically generated by the GitHub Actions workflow*" >> cypress/reports/README.md

          echo "Allure report generation completed successfully"
          echo "::endgroup::"
          
      # Add summary to workflow with simplified format
      - name: Add Test Summary to Job Summary
        if: always()
        run: |
          # Extract test outcomes from Cypress run
          TEST_FILES_COUNT=$(find cypress/e2e/test/API -name "*.cy.js" | wc -l)
          VIDEOS_COUNT=$(find cypress/videos -type f | wc -l)
          SCREENSHOTS_COUNT=$(find cypress/screenshots -type f | wc -l)
          REPORTS_COUNT=$(find cypress/reports -name "*.html" | wc -l)
          
          # Extract test information from Cypress' built-in JSON report if available
          MOCHA_FILE=$(find cypress/results -name "*.json" -not -path "*/node_modules/*" | head -1)
          if [ -n "$MOCHA_FILE" ] && [ -f "$MOCHA_FILE" ]; then
            TOTAL_TESTS=$(grep -o '"tests":[0-9]*' "$MOCHA_FILE" | awk -F: '{print $2}')
            PASSED_TESTS=$(grep -o '"passes":[0-9]*' "$MOCHA_FILE" | awk -F: '{print $2}')
            FAILED_TESTS=$(grep -o '"failures":[0-9]*' "$MOCHA_FILE" | awk -F: '{print $2}')
            PENDING_TESTS=$(grep -o '"pending":[0-9]*' "$MOCHA_FILE" | awk -F: '{print $2}')
            DURATION=$(grep -o '"duration":[0-9.]*' "$MOCHA_FILE" | awk -F: '{print $2}')
            
            # Convert to readable format
            if [ -n "$DURATION" ]; then
              DURATION=$(awk "BEGIN {printf \"%.3fs\", $DURATION/1000}")
            else
              DURATION="N/A"
            fi
            
            # Default values if not found
            TOTAL_TESTS=${TOTAL_TESTS:-0}
            PASSED_TESTS=${PASSED_TESTS:-0}
            FAILED_TESTS=${FAILED_TESTS:-0}
            PENDING_TESTS=${PENDING_TESTS:-0}
          else
            # Get test counts from Mocha/Cypress output files
            TEST_COUNT_FILES=$(find cypress -path "*/results/*" -name "*.json" | wc -l)
            if [ "$TEST_COUNT_FILES" -gt 0 ]; then
              TOTAL_TESTS=$TEST_COUNT_FILES
              PASSED_TESTS=$(find cypress -path "*/results/*" -name "*.json" -exec grep -l '"state": *"passed"' {} \; | wc -l)
              FAILED_TESTS=$(find cypress -path "*/results/*" -name "*.json" -exec grep -l '"state": *"failed"' {} \; | wc -l)
              PENDING_TESTS=$(find cypress -path "*/results/*" -name "*.json" -exec grep -l '"state": *"pending"' {} \; | wc -l)
              DURATION="N/A"
            else
              # Fallback to counting test files if no results
              TOTAL_TESTS=$TEST_FILES_COUNT
              PASSED_TESTS="N/A"
              FAILED_TESTS="N/A"
              PENDING_TESTS="N/A"
              DURATION="N/A"
            fi
          fi
          
          # Determine status based on step outcome
          if [ "${{ steps.cypress_tests.outcome }}" == "success" ]; then
            STATUS="Passing ✅"
          else
            STATUS="Failing 🔴"
          fi
                    
          # Extract Cypress Run ID from output log if available
          CYPRESS_RUN_ID=$(grep -o "Run URL: https://cloud.cypress.io/projects/1z2vqi/runs/[0-9a-z\-]*" $(find . -name "cypress.log" 2>/dev/null) 2>/dev/null | grep -o "[0-9a-z\-]*$" | head -1)
          
          # Chỉ hiển thị link đến lần chạy cụ thể (nếu có ID)
          if [ -n "$CYPRESS_RUN_ID" ]; then
            echo "**[View run in Cypress Cloud](https://cloud.cypress.io/projects/1z2vqi/runs/$CYPRESS_RUN_ID)** 🔍" >> $GITHUB_STEP_SUMMARY
          else 
            # Nếu không tìm thấy ID, sử dụng cách khác để trích xuất thông tin
            echo "**[View runs in Cypress Cloud](https://cloud.cypress.io/projects/1z2vqi)** 🔍" >> $GITHUB_STEP_SUMMARY
          fi

          # Write the consolidated summary
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $CYPRESS_ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| Node Version | $(node -v) |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | $GITHUB_WORKFLOW |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Date | $(date) |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ [Download Artifacts](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          
      # Consolidated upload of all test artifacts
      - name: Upload All Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-results-${{ github.run_id }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            allure-report/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 9

  # This job only runs if the primary API tests fail
  failure-analysis:
    name: Failure Analysis & Recovery
    needs: cypress-api-smoke-tests
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RETRY_COUNT: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # Download latest artifacts from the failed job for analysis
      - name: Download Test Artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.workflow }}
          workflow_conclusion: failure
          name_regex: cypress-test-results-.*
          path: downloaded-artifacts
          if_no_artifact_found: warn
          
      - name: List downloaded artifacts
        run: |
          echo "::group::Downloaded Artifacts"
          ls -la downloaded-artifacts || echo "No artifacts found"
          
          if [ -d "downloaded-artifacts" ]; then
            echo "Looking for reports, screenshots and videos..."
            find downloaded-artifacts -type f | grep -E '\.(html|png|mp4)$' || echo "No relevant files found"
          fi
          echo "::endgroup::"
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Generate Comprehensive Failure Analysis
        run: |
          mkdir -p failure-analysis
          
          # Get details about the failed job
          echo "## 🔍 Test Failure Analysis" >> $GITHUB_STEP_SUMMARY
          echo "Analyzing test failures from job: ${{ needs.cypress-api-smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          
          # Create professional HTML failure report
          echo "<!DOCTYPE html>" > failure-analysis/failure-report.html
          echo "<html lang='en'><head><meta charset='UTF-8'><title>API Test Failure Analysis</title>" >> failure-analysis/failure-report.html
          echo "<style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;color:#333;line-height:1.6}" >> failure-analysis/failure-report.html
          echo ".container{max-width:1000px;margin:0 auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 3px 15px rgba(0,0,0,0.1)}" >> failure-analysis/failure-report.html
          echo ".header{border-bottom:2px solid #eaeaea;padding-bottom:20px;margin-bottom:20px;display:flex;align-items:center}" >> failure-analysis/failure-report.html
          echo ".header h1{color:#e74c3c;margin:0;flex:1}.alert{background:#feeaea;border-left:4px solid #e74c3c;padding:15px;margin:15px 0}" >> failure-analysis/failure-report.html
          echo ".section{margin:25px 0}.action-item{background:#f8f9fa;padding:15px;margin:10px 0;border-radius:5px}" >> failure-analysis/failure-report.html
          echo ".diagnostic{font-family:monospace;background:#f5f5f5;padding:10px;overflow:auto;border-radius:4px}" >> failure-analysis/failure-report.html
          echo "</style></head><body><div class='container'>" >> failure-analysis/failure-report.html
          
          # Header section
          echo "<div class='header'>" >> failure-analysis/failure-report.html
          echo "<h1>API Tests Failure Analysis</h1>" >> failure-analysis/failure-report.html
          echo "</div>" >> failure-analysis/failure-report.html
          
          echo "<div class='alert'>" >> failure-analysis/failure-report.html
          echo "<strong>Critical Alert:</strong> API test failures detected in the CI pipeline." >> failure-analysis/failure-report.html
          echo "<p>This report was automatically generated on $(date) after failures were detected in the automated test run.</p>" >> failure-analysis/failure-report.html
          echo "</div>" >> failure-analysis/failure-report.html
          
          # Possible causes section
          echo "<div class='section'>" >> failure-analysis/failure-report.html
          echo "<h2>Potential Failure Causes</h2>" >> failure-analysis/failure-report.html
          echo "<div class='action-item'><strong>API Endpoint Issues</strong>: Endpoints may be unavailable or returning unexpected responses</div>" >> failure-analysis/failure-report.html
          echo "<div class='action-item'><strong>Authentication Failures</strong>: API keys may be invalid or expired</div>" >> failure-analysis/failure-report.html
          echo "<div class='action-item'><strong>Network Connectivity</strong>: Network issues between CI environment and API services</div>" >> failure-analysis/failure-report.html
          echo "<div class='action-item'><strong>Test Configuration</strong>: Environment variables or configuration issues</div>" >> failure-analysis/failure-report.html
          echo "<div class='action-item'><strong>Test Data</strong>: Test data may have changed or become invalid</div>" >> failure-analysis/failure-report.html
          echo "</div>" >> failure-analysis/failure-report.html
          
          # Recommended actions
          echo "<div class='section'>" >> failure-analysis/failure-report.html
          echo "<h2>Recommended Recovery Actions</h2>" >> failure-analysis/failure-report.html
          echo "<ol>" >> failure-analysis/failure-report.html
          echo "<li><strong>Verify API Status</strong>: Check the status of all dependent API services</li>" >> failure-analysis/failure-report.html
          echo "<li><strong>Review Credentials</strong>: Confirm that all API keys and credentials are valid</li>" >> failure-analysis/failure-report.html
          echo "<li><strong>Examine Logs</strong>: Review the test execution logs for error messages</li>" >> failure-analysis/failure-report.html
          echo "<li><strong>Check Recent Changes</strong>: Review recent code changes that might impact the tests</li>" >> failure-analysis/failure-report.html
          echo "<li><strong>Update Tests</strong>: Update test expectations if the API contract has changed</li>" >> failure-analysis/failure-report.html
          echo "</ol>" >> failure-analysis/failure-report.html
          echo "</div>" >> failure-analysis/failure-report.html
          
          echo "<div class='section'>" >> failure-analysis/failure-report.html
          echo "<h2>Next Steps</h2>" >> failure-analysis/failure-report.html
          echo "<p>This failure has been logged and appropriate team members have been notified. Please review the test results and take necessary actions to resolve the issues.</p>" >> failure-analysis/failure-report.html
          echo "</div>" >> failure-analysis/failure-report.html
          
          echo "</div></body></html>" >> failure-analysis/failure-report.html
          
      # Run comprehensive diagnostics with retry logic
      - name: Run Advanced Diagnostics
        run: |
          echo "::group::API Endpoint Diagnostics"
          echo "Running comprehensive diagnostics on critical API endpoints..."
          
          # More thorough endpoint checks with retry logic
          for i in $(seq 1 $RETRY_COUNT); do
            echo "Attempt $i of $RETRY_COUNT:"
            
            # Check Unsplash API
            echo "Testing Unsplash API connectivity..."
            curl -I -s -o /dev/null -w "%{http_code}" https://api.unsplash.com/photos || echo "Failed to connect to Unsplash API"
            
            # Check test endpoints
            echo "Testing JSONPlaceholder API connectivity..."
            curl -I -s -o /dev/null -w "%{http_code}" https://jsonplaceholder.typicode.com/posts/1 || echo "Failed to connect to test endpoint"
            
            # Add more endpoint checks as needed
            
            echo "Diagnostics attempt $i complete."
            sleep 2
          done
          echo "::endgroup::"
          
          # Add diagnostics summary to GitHub workflow summary
          echo "## 🩺 API Diagnostics Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status | Latency |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Unsplash API | $(curl -Is https://api.unsplash.com/photos -o /dev/null -w "%{http_code}" 2>/dev/null || echo "Failed") | $(curl -Is https://api.unsplash.com/photos -o /dev/null -w "%{time_total}s" 2>/dev/null || echo "N/A") |" >> $GITHUB_STEP_SUMMARY
          echo "| JSONPlaceholder | $(curl -Is https://jsonplaceholder.typicode.com/posts/1 -o /dev/null -w "%{http_code}" 2>/dev/null || echo "Failed") | $(curl -Is https://jsonplaceholder.typicode.com/posts/1 -o /dev/null -w "%{time_total}s" 2>/dev/null || echo "N/A") |" >> $GITHUB_STEP_SUMMARY
          
      # Create diagnostic logs file
      - name: Collect System Information
        run: |
          mkdir -p failure-analysis/diagnostics
          echo "=== System Information ===" > failure-analysis/diagnostics/system-info.txt
          uname -a >> failure-analysis/diagnostics/system-info.txt
          echo "" >> failure-analysis/diagnostics/system-info.txt
          echo "=== Network Information ===" >> failure-analysis/diagnostics/system-info.txt
          netstat -tuln >> failure-analysis/diagnostics/system-info.txt 2>/dev/null || echo "Network info not available" >> failure-analysis/diagnostics/system-info.txt
          echo "" >> failure-analysis/diagnostics/system-info.txt
          echo "=== Node Information ===" >> failure-analysis/diagnostics/system-info.txt
          node -v >> failure-analysis/diagnostics/system-info.txt
          npm -v >> failure-analysis/diagnostics/system-info.txt
          
      # Upload failure analysis with better structure
      - name: Upload Failure Analysis
        uses: actions/upload-artifact@v4
        with:
          name: failure-analysis-report
          path: failure-analysis
          retention-days: 30
          if-no-files-found: warn
          compression-level: 9
          
      # Send notification via email - Uncomment and add secrets for email notifications
      # - name: Send Email Notification
      #   if: always()
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: ${{ secrets.MAIL_SERVER }}
      #     server_port: 465
      #     username: ${{ secrets.MAIL_USERNAME }}
      #     password: ${{ secrets.MAIL_PASSWORD }}
      #     subject: "[${{ job.status }}] Cypress API Tests - Daily Scheduled Run"
      #     body: |
      #       Cypress API Tests Daily Scheduled Run completed with status: ${{ job.status }}
      #       
      #       Environment: ${{ github.event.inputs.environment || env.DEFAULT_ENVIRONMENT }}
      #       Date: $(date)
      #       Workflow: ${{ github.workflow }}
      #       Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      #       
      #       See attachment for detailed test results
      #     to: ${{ secrets.NOTIFICATION_EMAIL }}
      #     from: GitHub Actions
      #     attachments: ./failure-analysis/failure-report.html,./failure-analysis/diagnostics/system-info.txt
          
      # Send notification via Slack - Uncomment and add secrets for Slack notifications
      # - name: Send Slack Notification
      #   if: always()
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL || 'test-notifications' }}
      #     SLACK_COLOR: ${{ job.status == 'success' && 'good' || job.status == 'cancelled' && 'warning' || 'danger' }}
      #     SLACK_TITLE: "Cypress API Tests - Daily Scheduled Run"
      #     SLACK_MESSAGE: "Status: ${{ job.status }}\nEnvironment: ${{ github.event.inputs.environment || env.DEFAULT_ENVIRONMENT }}"
      #     SLACK_FOOTER: "See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
      # Console message (default enabled option)
      - name: Log Notification to Console
        run: |
          echo "========================================="
          echo "CYPRESS API TESTS COMPLETED: ${{ job.status }}"
          echo "Date: $(date)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "========================================="

